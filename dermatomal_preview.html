<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#f5f2ee;padding:16px}
.wrap{max-width:380px;margin:0 auto}
.map-container{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #ddd}
.map-container img{width:100%;display:block;user-select:none}
.map-container canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.info-panel{margin-top:10px;padding:12px 14px;border-radius:10px;border:1.5px solid #ddd;background:#fff;min-height:65px;transition:border-color .2s}
.info-title{font-size:13px;font-weight:700;margin-bottom:5px}
.info-body{font-size:12px;color:#555;line-height:1.65}
.hint{font-size:12px;color:#999;text-align:center;padding:10px 0}
.levels-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;justify-content:center}
.lvl-btn{font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;border:2.5px solid rgba(255,255,255,0.3);cursor:pointer;color:#fff;transition:all .15s;letter-spacing:.03em}
.lvl-btn:hover{transform:scale(1.06);border-color:rgba(255,255,255,0.7)}
.lvl-btn.active{border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.25)}
</style></head>

  const z = ZONES[id];
  if(!z) return;
  const iw = canvas.width, ih = canvas.height;
  const hex = z.color;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  ctx.fillStyle = `rgba(${r},${g},${b},0.55)`;
  z.pts.forEach(([xp,yp])=>{
    const x = xp/100*iw;
    const y = yp/100*ih;
    ctx.fillRect(x-2, y-2, 5, 5);
  });
}

Object.entries(ZONES).forEach(([id, z])=>{
  const btn = document.createElement('button');
  btn.className = 'lvl-btn';
  btn.id = 'btn-'+id;
  btn.textContent = z.label;
  btn.style.background = z.color;
  btn.onclick = () => select(id);
  row.appendChild(btn);
});

function select(id){
  if(cur===id){
    document.getElementById('btn-'+id).classList.remove('active');
    panel.innerHTML = '<div class="hint">Pulsa un nivel cervical para iluminar su zona</div>';
    panel.style.borderColor = '#ddd';
    drawZone(null);
    cur = null;
    return;
  }
  if(cur) document.getElementById('btn-'+cur).classList.remove('active');
  cur = id;
  document.getElementById('btn-'+id).classList.add('active');
  const nf = info[id];
  panel.innerHTML = `<div class="info-title" style="color:${ZONES[id].color}">${nf.title}</div><div class="info-body">${nf.body}</div>`;
  panel.style.borderColor = ZONES[id].color;
  drawZone(id);
}

if(img.complete) setupCanvas();
else img.onload = setupCanvas;
</script>
</body></html>
