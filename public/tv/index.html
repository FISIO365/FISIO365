<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>FISIO365 · TV</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}
#c{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F5F2EE;font-family:Poppins,system-ui,-apple-system,sans-serif;color:#141414;transition:opacity .6s}
#c.fuera{opacity:0;pointer-events:none}
#c b{font-size:44px;letter-spacing:-.02em;font-weight:700}#c b span{color:#C2552E}
#c p{margin:0;font-size:22px;color:#6b6158}
#c i{display:block;width:420px;max-width:70vw;height:8px;border-radius:8px;background:#E6DDD3;overflow:hidden}
#c i u{display:block;height:100%;width:0;background:#C2552E;border-radius:8px;transition:width .3s}
#s{position:fixed;right:28px;bottom:24px;font:600 18px Poppins,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.45);border-radius:99px;padding:10px 18px;opacity:0;transition:opacity .4s}
#s.on{opacity:1}
</style></head><body>
<video id="v" muted playsinline preload="auto"></video>
<div id="c"><b>FISIO<span>365</span></b><p id="t">Cargando el vídeo…</p><i><u id="b"></u></i></div>
<div id="s"></div>
<script>
// Vídeo de la TV de recepción: se descarga una sola vez (se guarda en la memoria de la tele) y se repite sin parar, sin anuncios.
// Botón OK del mando (o un clic): sonido sí / no.
var v=document.getElementById('v'),c=document.getElementById('c'),t=document.getElementById('t'),b=document.getElementById('b'),s=document.getElementById('s');
// Programación (fecha de la tele):
//  · hasta el 27/11/2026: alterna Navidad y el vídeo normal
//  · del 28/11/2026 al 6/1/2027: solo Navidad
//  · desde el 7/1/2027: solo el vídeo normal
var NORMAL='/tv/fisio365-tv-2.mp4',NAVIDAD='/tv/navidad-2026b.mp4';
function hoy(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function lista(){var h=hoy();if(h<=20261127)return[NAVIDAD,NORMAL];if(h<=20270106)return[NAVIDAD];return[NORMAL];}
var blobs={},cargando={},actual=null,pos=0;
function aviso(x){s.textContent=x;s.classList.add('on');clearTimeout(aviso.t);aviso.t=setTimeout(function(){s.classList.remove('on');},2500);}
function pon(url){actual=url;v.src=blobs[url]||url;var p=v.play();if(p&&p.catch)p.catch(function(){});}
v.addEventListener('playing',function(){c.classList.add('fuera');});
// Descarga entera (se guarda en la memoria de la tele); si no deja, se reproduce directamente
function baja(url,conBarra,listo){if(blobs[url]){listo();return}if(cargando[url])return;cargando[url]=1;
 try{var x=new XMLHttpRequest();x.open('GET',url,true);x.responseType='blob';
  if(conBarra)x.onprogress=function(e){if(e.lengthComputable){var p=Math.round(e.loaded*100/e.total);b.style.width=p+'%';t.textContent='Cargando el vídeo… '+p+' %';}};
  x.onload=function(){cargando[url]=0;if(x.status===200&&x.response&&x.response.size>1e6)blobs[url]=URL.createObjectURL(x.response);listo();};
  x.onerror=function(){cargando[url]=0;listo();};x.send();
 }catch(e){cargando[url]=0;listo();}}
function siguiente(){var L=lista();pos=(pos+1)%L.length;var url=L[pos];
 pon(url); // si aún no está guardado en memoria, lo reproduce directamente desde internet
 L.forEach(function(u){baja(u,false,function(){});});}
// Arranque: el primero de la lista con barra; los demás se bajan detrás
(function(){var L=lista();pos=0;baja(L[0],true,function(){b.style.width='100%';pon(L[0]);L.slice(1).forEach(function(u){baja(u,false,function(){});});});})();
// Al acabar un vídeo pasa al siguiente (y mira la fecha cada vez)
v.addEventListener('ended',siguiente);
setInterval(function(){if(v.src&&v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}},5000);
v.addEventListener('error',function(){setTimeout(function(){location.reload();},10000);});
// Sonido con OK / clic; pantalla completa si la tele lo permite
function toca(){v.muted=!v.muted;aviso(v.muted?'Sin sonido':'Con sonido');var d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(function(){});}
document.addEventListener('click',toca);
document.addEventListener('keydown',function(e){if(e.keyCode===13)toca();});
// Que la pantalla no se apague mientras se ve (si la tele lo permite)
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
</script>
</body></html>
