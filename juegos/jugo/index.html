<style>

.blink{animation:bl 1.1s steps(2) infinite}

.snd{position:absolute;right:20px;top:18px;z-index:5;width:44px;height:44px;border-radius:50%;border:2.5px solid #16120F;background:#FFFDF8;display:flex;align-items:center;justify-content:center}

.chip b{font-family:'DM Sans',sans-serif!important;font-size:15px!important;font-weight:700}

.badge,.jack{border:1.5px solid #16120F!important;background:#FFFDF8!important;color:#16120F!important;font-family:'DM Sans',sans-serif!important;font-weight:700!important;font-size:13px!important;letter-spacing:.12em!important;padding:7px 16px!important}

.meter{height:6px!important;border:1.5px solid #16120F!important}
.row .bar{height:6px!important;border:1.5px solid #16120F!important}
.hold.on{transform:scale(.98)!important}
.blink{font-weight:600!important;letter-spacing:.12em!important;opacity:.55}

<div id="app">

<section class="scr" id="s-end" style="overflow-y:auto">
  <div class="hud"><span class="chip"><b id="fpts">0</b> puntos</span><span class="chip" id="newrec" style="display:none;background:#F26A1B">Nuevo récord</span></div>
  <div style="text-align:center;margin-top:20px">
    <svg width="130" height="143" viewBox="0 0 300 330" aria-hidden="true" style="overflow:visible"><defs><clipPath id="cl"><circle cx="150" cy="190" r="124"/></clipPath></defs><g transform="rotate(-40 150 52)"><path d="M150 52 A58 58 0 0 1 244 52 A58 58 0 0 1 150 52 Z" fill="#FFFDF8" stroke="#16120F" stroke-width="5" stroke-linejoin="round"/></g><circle cx="150" cy="190" r="128" fill="#FFFDF8" stroke="#16120F" stroke-width="5"/><rect id="fill" clip-path="url(#cl)" x="0" y="318" width="300" height="260" fill="#F26A1B"/><circle cx="150" cy="190" r="128" fill="none" stroke="#16120F" stroke-width="5"/></svg>

    <p class="ser" style="font-size:24px;margin-top:0">de jugo</p>
    <p class="badge" id="lvl" style="margin-top:14px">NIVEL</p>
    <p class="ser" id="lvlt" style="font-size:24px;margin-top:12px;line-height:1.2"></p>
  </div>
  <p style="font-weight:700;margin:22px 0 10px">Tres cosas que harían los que van por delante:</p>
  <div id="tips" style="display:flex;flex-direction:column;gap:10px"></div>

    <div style="display:flex;gap:12px"><button class="gb" id="again" style="flex:1">Otra vez</button><button class="gb" id="share" style="flex:1">Retar a alguien</button></div>
  </div>
</section>

<button class="snd" id="snd" aria-label="Sonido"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16120F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sw" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
</div>
<script>
var Q=[
 ['Un cliente quiere reservar a las 23:00. ¿Puede?',[['Sí, online, en un minuto',3],['Me deja un WhatsApp y le contesto mañana',1],['Que llame mañana',0]]],
 ['¿Qué pasa el día antes de una cita?',[['Le llega un recordatorio solo',3],['Le escribo yo, si me acuerdo',1],['Nada',0]]],
 ['¿Cómo haces las facturas?',[['Salen solas al cobrar',3],['Con una plantilla, una a una',1],['A mano o con Excel',0]]],
 ['Un cliente lleva 3 meses sin venir. ¿Te enteras?',[['Sí, el programa me avisa',3],['Si me acuerdo de su cara',1],['No',0]]],
 ['Si te buscan en Google desde el móvil…',[['Encuentran mi web y reservan',3],['Ven una web antigua',1],['No salgo',0]]],
 ['¿Cuánto tardas en saber cómo va el mes?',[['Lo veo en un vistazo',3],['Una tarde con papeles',1],['Ni idea',0]]]
];
var TIPS=[
 'Reservas online 24 horas: tus clientes reservan cuando les va bien, también a las 23:00.',
 'Recordatorios automáticos el día antes: menos citas olvidadas y menos sillas vacías.',

 'Avisos de clientes que llevan tiempo sin venir, para escribirles a tiempo.',

var $=function(q){return document.querySelector(q)},i=0,pts=0,score=0,combo=0,t0=0,raf=0,lock=false,picks=[],sound=true;
try{sound=localStorage.getItem('mj_snd')!=='0'}catch(e){}
var AC;function beep(f,d,tp,v){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=tp||'square';o.frequency.value=f;g.gain.value=v||.06;o.connect(g);g.connect(AC.destination);var n=AC.currentTime;g.gain.setValueAtTime(v||.06,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
function jingle(a){a.forEach(function(f,k){setTimeout(function(){beep(f,.14,'square',.05)},k*110)})}
function snd(){$('#sw').style.display=sound?'':'none'}snd();
$('#snd').onclick=function(){sound=!sound;try{localStorage.setItem('mj_snd',sound?'1':'0')}catch(e){};snd();beep(660,.08)};
function rec(){try{return +localStorage.getItem('mj_rec')||0}catch(e){return 0}}
if(rec()){$('#rec0').style.display='inline-flex';$('#rec0v').textContent=rec()}
function show(id){document.querySelectorAll('.scr').forEach(function(s){s.classList.toggle('on',s.id===id)})}
function press(b){b.classList.add('press');setTimeout(function(){b.classList.remove('press')},120)}
$('#go').onclick=function(){press(this);jingle([523,659,784,1047]);setTimeout(start,350)};
function start(){i=0;pts=0;score=0;combo=0;picks=[];$('#pts').textContent=0;show('s-play');ask()}
function dots(){$('#dots').innerHTML=Q.map(function(_,k){return '<span class="'+(k<i?(picks[k]===3?'c':'d'):'')+'"></span>'}).join('')}
function ask(){lock=false;var q=Q[i];$('#qn').textContent=i+1;$('#q').textContent=q[0];dots();
 var opts=q[1].slice().sort(function(){return Math.random()-.5});
 $('#ans').innerHTML=opts.map(function(o){return '<button class="gb" data-v="'+o[1]+'">'+o[0]+'</button>'}).join('');
 document.querySelectorAll('#ans .gb').forEach(function(b){b.onclick=function(){pick(b)}});
 t0=performance.now();cancelAnimationFrame(raf);tick()}
function tick(){var e=(performance.now()-t0)/8000;$('#tb').style.transform='scaleX('+Math.max(0,1-e)+')';$('#tb').style.background=e>.7?'#E0402B':'#F26A1B';
 if(e>=1){if(!lock){lock=true;beep(160,.35,'sawtooth',.06);combo=0;$('#combo').classList.remove('on');picks[i]=0;next()}return}raf=requestAnimationFrame(tick)}

 if(v===3){combo++;var gain=Math.round((100+Math.max(0,1-e)*100)*(combo>1?2:1));pts+=gain;b.classList.add('ok');jingle(combo>1?[784,988,1319]:[659,880]);
   pop('+'+gain,b);if(combo>1){$('#combo').textContent='x'+combo+' combo';$('#combo').classList.remove('on');void $('#combo').offsetWidth;$('#combo').classList.add('on')}}

 $('#pts').textContent=pts;setTimeout(next,750)}

function end(){show('s-end');var pct=Math.round(score/18*100),r=rec(),nr=pts>r;$('#fpts').textContent=pts;$('#newrec').style.display=nr?'inline-flex':'none';if(nr){try{localStorage.setItem('mj_rec',pts)}catch(e){}}
 var L=pct>=80?['EXPRIMIDO','Tu negocio va a tope. Ahora, a por el último gajo.']:pct>=45?['MEDIO JUGO','Vas bien, pero se te escapa zumo por el camino.']:['SIN EXPRIMIR','Aquí hay muchísimo jugo esperando. ¡Buena noticia!'];
 $('#lvl').textContent=L[0];$('#lvlt').textContent=L[1];

 var weak=picks.map(function(v,ix){return [v,ix]}).sort(function(a,b){return a[0]-b[0]}).slice(0,3);

 $('#wa').href='https://wa.me/34675435187?text='+encodeURIComponent('Hola Nora, he jugado a «¿Cuánto jugo le falta a tu negocio?» y me ha salido un '+pct+' % ('+L[0].toLowerCase()+'). ¿Me ayudas a exprimirlo?');
 if(nr||pct>=45)setTimeout(confetti,500);setTimeout(function(){jingle(pct>=45?[523,659,784,1047,1319]:[392,330,262])},300)}
$('#again').onclick=function(){press(this);jingle([523,659]);setTimeout(function(){show('s-start');if(rec()){$('#rec0').style.display='inline-flex';$('#rec0v').textContent=rec()}},200)};

function confetti(){var C=['#F26A1B','#FFFDF8','#16120F','#F2B705'];for(var k=0;k<34;k++){var c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=C[k%4];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(function(x){return function(){x.remove()}}(c),3800)}}
