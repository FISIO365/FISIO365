<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#333333}
*{box-sizing:border-box}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 3s ease-in-out infinite}.b2{animation-delay:.8s}.b3{animation-delay:1.6s}
.spinr{animation:spin 80s linear infinite;transform-origin:150px 150px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes popin2{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.popA{animation:popin .45s cubic-bezier(.2,1.6,.4,1) both;transform-origin:center bottom}.popB{animation:popin2 .45s cubic-bezier(.2,1.6,.4,1) both;transform-origin:center bottom}.d-late{animation-delay:.45s}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}

.fade{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
.track{display:flex;width:max-content;animation:marquee 40s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.hint{animation:hint 2.4s ease-in-out infinite}
.reveal{animation:fadeUp linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
.btn{transition:background .25s ease,color .25s ease,border-color .25s ease,transform .25s ease}
.btn:hover{transform:translateY(-1px)}
.btn-main:hover{background:#333333 !important;color:#FFFFFF !important}
.btn-line:hover{border-color:#B5B5B3 !important;background:rgba(0,0,0,.025) !important}
.card{transition:border-color .3s ease,background .3s ease,transform .3s ease}
.card:hover{border-color:rgba(17,17,17,.35) !important;background:#FAFAF9 !important;transform:translateY(-2px)}
.swap{animation:fadeUp .5s ease both}
.chip-on{background:#111111;color:#FFFFFF;border-color:#111111 !important}
.chip-off{background:#FFFFFF;color:#111111}
.chip-off:hover{border-color:#111111 !important}
.band{fill:none;stroke-width:16;transition:stroke .45s ease}
.b-neutral{stroke:#F0F0EE}.b-help{stroke:#A8CF97}.b-harm{stroke:#F2C4C4}
.ldot{transition:background .45s ease}.ldot.b-neutral{background:#E6E6E4}.ldot.b-help{background:#A8CF97}.ldot.b-harm{background:#F2C4C4}
.chip-best{background:#DCEBD2;color:#111111;border-color:#111111 !important}.chip-tried{background:#F5F5F3;color:#8A8A8A}
.selring{transition:r .45s cubic-bezier(.3,1.3,.5,1)}
.vdot{fill:#FFFFFF;stroke:#111111;stroke-width:1.5;transition:fill .3s ease}.vdot.v-hit{fill:#111111}
.k-on{background:#DCEBD2;border-color:#111111 !important;color:#111111}.k-on .kletter{background:#111111;color:#FFFFFF}
.k-off{background:#FFFFFF;color:#111111}.k-off .kletter{border:1px solid #D6D6D4;color:#4A4A4A}.k-off:hover{border-color:#111111 !important}
@keyframes shakeA{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes shakeB{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shakeA{animation:shakeA .45s ease}.shakeB{animation:shakeB .45s ease}
.tab-on{background:#111111;color:#FFFFFF;border-color:#111111 !important}
.tab-on .tabnum{background:#111111;color:#FFFFFF}
.tab-off{background:#FFFFFF;color:#111111}
.tab-off .tabnum{border:1px solid #D6D6D4;color:#4A4A4A}
.tab-off:hover{border-color:#111111 !important}
.msg-ok{background:#EEF4EA;color:#2F4A26}
.msg-bad{background:#F9E9E2;color:#7A2E10}
.pill{transition:top .45s cubic-bezier(.3,1.3,.5,1),opacity .3s ease}
.tone .tdot{background:#FFFFFF;border:1px solid #CFCFCD;transition:background .3s ease,border-color .3s ease,transform .3s ease}
.tone:hover .tdot{border-color:#111111}
.tone-on .tdot{background:#111111;border-color:#111111;transform:scale(1.25)}
.tone-on{font-weight:500}
.tg-on{background:#111111;color:#FFFFFF}.tg-off{background:transparent;color:#111111}
.dot-on{width:26px;background:#E6DAF0}.dot-off{width:10px;background:#FFFFFF}
.stA{animation:popin .5s cubic-bezier(.2,1.5,.4,1) both}.stB{animation:popin2 .5s cubic-bezier(.2,1.5,.4,1) both}
.steplbl{align-self:flex-start;display:inline-flex;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#111111;border:1.5px solid #111111;border-radius:999px;padding:5px 12px;margin-bottom:-6px}
.sp-on{background:#111111;color:#FFFFFF}.sp-done{background:#DCEBD2;color:#111111}.sp-off{background:#FFFFFF;color:#8A8A8A;border-color:#CFCFCD !important}
.bar-on{background:#111111}.bar-seen{background:#DCEBD2}.bar-off{background:#E3E3E1}
.seg-on{background:#111111}.seg-off{background:#D6D6D4}
.locked{filter:blur(10px) brightness(1.04);pointer-events:none;user-select:none}
.open{filter:none;transition:filter 1.2s ease}
input,textarea{color:#111111}
input::placeholder,textarea::placeholder{color:#8A8A8A}
input:focus,textarea:focus{outline:1px solid #111111;outline-offset:2px}

.ccard{background:#F2D4D4 !important}

.blue{background:#D3E4F3 !important;color:#111111;border-color:#111111 !important}
.m-contact.blue{background:#F5E6B8 !important;border:1.5px solid #111111 !important}
.blue p,.blue label{color:#333333 !important}

.dark .slabel{color:#FFFFFF !important}
.dark .btn-line{color:#FFFFFF !important;border-color:#6B6B6B !important;background:transparent !important}

@media (max-width:720px){

  .sechead{margin-bottom:44px !important;gap:20px !important}

</style>
<style>
.dark .rec{color:#111111 !important}
.tchip{background:transparent !important;color:#FFFFFF !important;-webkit-text-fill-color:#FFFFFF;border:1.5px solid #FFFFFF !important;transition:background .2s ease,color .2s ease}

<div id="app"></div>
<script type="text/x-template" id="tpl">


<div style="font-family:'Inter',system-ui,sans-serif;color:#111111;background:#FFFFFF;min-height:100vh">

  
  <div class="wrap" style="max-width:1200px;margin:0 auto;padding:22px 32px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
    <a href="#inicio" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#111111">
      <span class="pulse" style="width:9px;height:9px;border-radius:50%;background:#111111;display:inline-block"></span>
      <span style="font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:300;letter-spacing:.02em">descúbrete</span>
    </a>
    <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">
      <a href="#test" class="hide-m" style="padding:10px 14px;text-decoration:none;color:#6B6B6B;font-size:14px">Test</a>
      <a href="#empezar" class="hide-m" style="padding:10px 14px;text-decoration:none;color:#6B6B6B;font-size:14px">Precios</a>
      <a href="#dudas" class="hide-m" style="padding:10px 14px;text-decoration:none;color:#6B6B6B;font-size:14px">Dudas</a>
      <a :href="waCafe" target="_blank" rel="noopener" class="btn btn-line" style="display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1.5px solid #111111;border-radius:999px;text-decoration:none;color:#111111;font-size:14px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 18.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><path d="M9.2 9.3c.3 2.4 2 4.3 4.6 5.2l1.2-1.2 1.8.9-.4 1.4c-3.8.3-7.7-3.4-8-7.2l1.4-.5 1 1.8z" fill="currentColor"></path></svg>Escríbeme</a>
    </div>
  </div>

  
  <div id="inicio" class="wrap" style="max-width:1200px;margin:0 auto;padding:16px 32px 110px">
    <div class="hero-grid" style="border:1.5px solid #111111;border-radius:32px;background:#FFFFFF;padding:64px 56px;display:flex;flex-wrap:wrap;gap:56px;align-items:center">
      <div class="fade" style="flex:999 1 500px;min-width:0;display:flex;flex-direction:column;gap:26px">
        <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1.5px solid #111111;border-radius:999px;background:#F6D9C4;font-size:13px;font-weight:500">Para cualquier persona, de cualquier edad</span>
        <h1 class="hero-title" style="margin:0;font-family:'Inter Tight',sans-serif;font-weight:200;font-size:80px;line-height:1;letter-spacing:-.045em">Más calma, mejores relaciones y <span class="acc mk5" style="font-weight:400">más ganas de vivir.</span></h1>
        <p style="margin:0;max-width:540px;font-size:19px;line-height:1.6;color:#4A4A4A">Scientology te da herramientas prácticas para tu día a día. Te lo cuento yo en una llamada o con un café, como prefieras. Sin ningún compromiso.</p>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <a :href="waCafe" target="_blank" rel="noopener" class="btn btn-main" style="display:inline-flex;align-items:center;gap:10px;padding:17px 30px;border-radius:999px;background:#111111;color:#FFFFFF;text-decoration:none;font-weight:500;font-size:16px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 18.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><path d="M9.2 9.3c.3 2.4 2 4.3 4.6 5.2l1.2-1.2 1.8.9-.4 1.4c-3.8.3-7.7-3.4-8-7.2l1.4-.5 1 1.8z" fill="currentColor"></path></svg>Hablemos: llamada o café</a>
          <a href="#test" class="btn btn-line" style="padding:17px 28px;border-radius:999px;border:1.5px solid #111111;color:#111111;text-decoration:none;font-weight:500;font-size:16px">Test de 1 minuto</a>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px 22px">
          <span class="trust"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="#111111" stroke-width="1.2"></circle><path d="M5.5 9.2l2.3 2.3 4.7-5" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Gratis y sin compromiso</span>
          <span class="trust"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="#111111" stroke-width="1.2"></circle><path d="M5.5 9.2l2.3 2.3 4.7-5" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Te respondo yo</span>
          <span class="trust"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="#111111" stroke-width="1.2"></circle><path d="M5.5 9.2l2.3 2.3 4.7-5" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Respondo en menos de 24 h</span>
        </div>
      </div>
      <div class="fade d2" style="flex:1 1 300px;display:flex;justify-content:center;min-width:0">
        <div class="m-pic" style="position:relative;width:min(340px,100%);aspect-ratio:1 / 1">
          <svg viewBox="0 0 300 300" aria-hidden="true" style="position:absolute;inset:-6%;width:112%;height:112%;overflow:visible"><circle cx="150" cy="150" r="146" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="2 7" stroke-linecap="round" class="spinr"></circle></svg>
          <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid #111111;background:#F6D9C4"></div>
          <div style="position:absolute;inset:7%;border-radius:50%;border:1.5px solid #111111;background:#F6F6F4;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#6B6B6B">[Tu foto]</div>
          <span class="bubble bob">Hola, soy Ramiro. Pregúntame lo que quieras.</span>
          <span class="bob b2" style="position:absolute;right:-4%;bottom:14%;border:1.5px solid #111111;background:#111111;color:#FFFFFF;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;white-space:nowrap">Empresario · Barcelona</span>
        </div>
      </div>
    </div>
  </div>

  
  <div id="tesuena" class="wrap m-sec" style="max-width:1200px;margin:0 auto;padding:0 32px 120px">
    <div class="reveal sechead" style="display:flex;flex-direction:column;gap:22px;max-width:780px;margin-bottom:48px">
      <span class="slabel" style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#111111">01 — Sé sincero</span>
      <h2 class="h2" style="margin:0;font-family:'Inter Tight',sans-serif;font-weight:200;font-size:68px;line-height:1.02;letter-spacing:-.04em">¿Te suena <span class="acc mk4" style="font-weight:400">alguna de estas?</span></h2>
      <p style="margin:0;font-size:17px;line-height:1.6;color:#4A4A4A">Toca las que te pasen. Nadie lo ve, es solo para ti.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px">
      <template v-for="x in sits">
        <button type="button" @click="x.pick" :class="`btn sit ${x.cls}`" style="font:inherit;text-align:left;cursor:pointer;padding:20px 20px;border-radius:20px;border:1.5px solid #111111;display:flex;gap:14px;align-items:flex-start;min-height:96px">
          <span class="sitcheck" style="flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid #111111;display:inline-flex;align-items:center;justify-content:center;margin-top:1px">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <span style="font-size:16px;line-height:1.4">{{x.t}}</span>
        </button>
      </template>
      <a :href="waSit" target="_blank" rel="noopener" @click="tell" class="btn sit sit-other" style="text-decoration:none;color:#111111;padding:20px;border-radius:20px;border:1.5px dashed #111111;display:flex;gap:14px;align-items:flex-start;min-height:96px;background:#FFFFFF">
        <span style="flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid #111111;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;font-size:16px;line-height:1">+</span>
        <span style="font-size:16px;line-height:1.4">Me pasa otra cosa…<br><span style="font-size:13px;color:#6B6B6B">Escríbela con tus palabras</span></span>
      </a>
    </div>

    const tally = {};
    sel.forEach((i) => { const g = SITS[i][1]; tally[g] = (tally[g] || 0) + 1; });
    let sug = -1, best = 0;
    sel.forEach((i) => { const g = SITS[i][1]; if (tally[g] > best) { best = tally[g]; sug = g; } });
    const sitList = sel.map((i) => SITS[i][0].charAt(0).toLowerCase() + SITS[i][0].slice(1));
    const joined = sitList.length > 1 ? sitList.slice(0, -1).join(', ') + ' y ' + sitList[sitList.length - 1] : (sitList[0] || '');
    const myLine = n ? ' Me pasa que ' + joined + '.' : '';
    const goals = GOALS.map((g, i) => ({ label: g.label, cls: i === sug ? 'sug' : '', pick: () => this.setState({ goal: i, q: 1, answers: [] }) }));
    const ans = (v) => () => this.setState({ answers: s.answers.concat([v]), q: s.q + 1 });
    const done = s.q > QS.length;
    const g = s.goal >= 0 ? GOALS[s.goal] : (sug >= 0 ? GOALS[sug] : GOALS[0]);
    const rec = CURSOS[g.c];
    const autoCourse = s.goal >= 0 ? GOALS[s.goal].c : (sug >= 0 ? GOALS[sug].c : 0);
    const ci = s.coursePicked ? s.course : autoCourse;
    const cursos = CURSOS.map((t, i) => ({ t: t, cls: i === ci ? 'chip-on' : 'chip-off', pick: () => this.setState({ course: i, coursePicked: true }) }));
    return {
      waCafe: wa('Hola Ramiro, he visto tu web y me gustaría hablar contigo (por llamada o con un café).' + myLine),
      waDuda: wa('Hola Ramiro, he visto tu web y tengo una duda: '),
      waCurso: wa('Hola Ramiro, quiero apuntarme al curso «' + CURSOS[ci] + '». ¿Cómo lo hago?'),
      waRec: wa('Hola Ramiro, he hecho el test de tu web y me recomienda el curso «' + rec + '».' + myLine + ' ¿Cómo me apunto?'),
      sits: sits,
      tellLabel: n ? 'Cuéntamelo por WhatsApp' : 'Me pasa otra cosa',
      moreHref: PAGE === 'web' ? '#test' : '/',
      moreLabel: PAGE === 'web' ? 'Ver qué me iría mejor' : 'Conocer más',
      tell: (e) => {
        const T = typeof window !== 'undefined' ? window.Tally : null;
        if (!T || !T.openPopup) return;
        if (e && e.preventDefault) e.preventDefault();
        const temaTxt = sug >= 0 ? GOALS[sug].label : '';
        T.openPopup(TALLY, {
          layout: 'modal', width: 520, autoClose: 600,
          hiddenFields: { situaciones: sel.map((i) => SITS[i][0]).join(' | '), tema: temaTxt, pagina: PAGE },
          onSubmit: (payload) => {
            let otra = '';
            ((payload && payload.fields) || []).forEach((f) => { if (f.type === 'TEXTAREA' && f.value) otra = String(f.value); });
            const extra = otra ? (myLine ? ' Y también: ' : ' Me pasa que: ') + otra.trim() : '';
            const url = wa('Hola Ramiro, he visto tu web.' + myLine + extra + ' ¿Me ayudas?');
            setTimeout(() => { window.location.href = url; }, 700);
          }
        });
      },
      hasSel: n > 0,
      sugGoal: sug >= 0 ? GOALS[sug].label.toLowerCase() : '',
      sitAnim: s.tick % 2 ? 'cA' : 'cB',
      sitTitle: n === 0 ? 'Toca las que te pasen' : (n === 1 ? 'Te pasa 1 de estas.' : 'Te pasan ' + n + ' de estas.'),
      sitText: n === 0 ? 'Verás que no eres el único, y que tiene solución.' : (n < 3 ? 'Tiene solución, y es más sencillo de lo que crees. Cuéntamelo y lo vemos juntos.' : 'No eres el único: le pasa a mucha gente, y se puede cambiar. Cuéntamelo y te digo por dónde empezar.'),
      waSit: wa('Hola Ramiro, he visto tu web.' + (myLine || ' ') + ' ¿Me ayudas?'),
      closeText: n ? 'Me has contado ' + n + (n === 1 ? ' cosa que te pasa' : ' cosas que te pasan') + '. Tiene solución. Escríbeme y te llamo, o quedamos para un café, cuando te venga bien.' : 'Escríbeme y te llamo, o quedamos para un café, cuando te venga bien. Me preguntas todo lo que quieras, sin compromiso.',
      dudas: dudas,
      steps: [0, 1, 2, 3].map((i) => ({ cls: i < s.q ? 'seg-on' : 'seg-off' })),
      qGoal: s.q === 0,
      qAsk: s.q >= 1 && !done,
      qDone: done,
      goals: goals,
      qNum: Math.min(s.q, 3),
      qText: s.q >= 1 && !done ? QS[s.q - 1] : '',
      opts: [{ label: 'Sí', pick: ans(2) }, { label: 'A veces', pick: ans(1) }, { label: 'No', pick: ans(0) }],
      recCourse: rec,
      recText: g.why + ' Es corto, práctico y sin compromiso de seguir después.',
      resetQuiz: () => this.setState({ q: 0, goal: -1, answers: [] }),
      goBack: () => this.setState(s.q <= 1 ? { q: 0, answers: [] } : { q: s.q - 1, answers: s.answers.slice(0, -1) }),
      cursos: cursos,
      cursoSel: CURSOS[ci]
    };
  }
}

const { createApp, reactive, computed } = Vue;
const inst = new Component({});
inst.state = reactive(inst.state || {});
const app = createApp({
  template: '#tpl',
  setup() {
    const vals = computed(() => inst.renderVals());
    const out = {};
    Object.keys(vals.value).forEach((k) => Object.defineProperty(out, k, { get: () => vals.value[k], enumerable: true }));
    return out;
  }
});
app.config.compilerOptions.whitespace = 'preserve';
app.mount('#app');
</script>
</body>
</html>
