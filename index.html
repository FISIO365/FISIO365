<p style="margin: 0; font-size: 16px; line-height: 1.5">Te enseño cómo quedará antes de construir nada. Lo cambiamos todas las veces que haga falta hasta que digas «¡esto!».</p>

<div class="card rv" style="border: 1.5px solid #16120F; border-radius: 28px; padding: 28px; background: #F7F1E8">

<p style="margin: 18px 0 6px; font-size: 22px; font-weight: 700">Construyo</p>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Doy vida al diseño: textos, animaciones, formularios y todo conectado. Tú lo vas viendo crecer.</p>
</div>
