<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descúbrete — Scientology contado por Ramiro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&amp;family=Inter:wght@400;500&amp;family=Instrument+Serif&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#333333}
*{box-sizing:border-box}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 3s ease-in-out infinite}.b2{animation-delay:.8s}.b3{animation-delay:1.6s}
.spinr{animation:spin 80s linear infinite;transform-origin:150px 150px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes popin2{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.popA{animation:popin .45s cubic-bezier(.2,1.6,.4,1) both;transform-origin:center bottom}.popB{animation:popin2 .45s cubic-bezier(.2,1.6,.4,1) both;transform-origin:center bottom}.d-late{animation-delay:.45s}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes hint{0%,100%{opacity:.45}50%{opacity:1}}
.fade{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
.track{display:flex;width:max-content;animation:marquee 40s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.hint{animation:hint 2.4s ease-in-out infinite}
.reveal{animation:fadeUp linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
.btn{transition:background .25s ease,color .25s ease,border-color .25s ease,transform .25s ease}
.btn:hover{transform:translateY(-1px)}
.btn-main:hover{background:#333333 !important;color:#FFFFFF !important}
.btn-line:hover{border-color:#B5B5B3 !important;background:rgba(0,0,0,.025) !important}
.card{transition:border-color .3s ease,background .3s ease,transform .3s ease}
.card:hover{border-color:rgba(17,17,17,.35) !important;background:#FAFAF9 !important;transform:translateY(-2px)}
.swap{animation:fadeUp .5s ease both}
.chip-on{background:#111111;color:#FFFFFF;border-color:#111111 !important}
.chip-off{background:#FFFFFF;color:#111111}
.chip-off:hover{border-color:#111111 !important}
.band{fill:none;stroke-width:16;transition:stroke .45s ease}
.b-neutral{stroke:#F0F0EE}.b-help{stroke:#A8CF97}.b-harm{stroke:#F2C4C4}
.ldot{transition:background .45s ease}.ldot.b-neutral{background:#E6E6E4}.ldot.b-help{background:#A8CF97}.ldot.b-harm{background:#F2C4C4}
.chip-best{background:#DCEBD2;color:#111111;border-color:#111111 !important}.chip-tried{background:#F5F5F3;color:#8A8A8A}
.selring{transition:r .45s cubic-bezier(.3,1.3,.5,1)}
.vdot{fill:#FFFFFF;stroke:#111111;stroke-width:1.5;transition:fill .3s ease}.vdot.v-hit{fill:#111111}
.k-on{background:#DCEBD2;border-color:#111111 !important;color:#111111}.k-on .kletter{background:#111111;color:#FFFFFF}
.k-off{background:#FFFFFF;color:#111111}.k-off .kletter{border:1px solid #D6D6D4;color:#4A4A4A}.k-off:hover{border-color:#111111 !important}
@keyframes shakeA{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes shakeB{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shakeA{animation:shakeA .45s ease}.shakeB{animation:shakeB .45s ease}
.tab-on{background:#111111;color:#FFFFFF;border-color:#111111 !important}
.tab-on .tabnum{background:#111111;color:#FFFFFF}
.tab-off{background:#FFFFFF;color:#111111}
.tab-off .tabnum{border:1px solid #D6D6D4;color:#4A4A4A}
.tab-off:hover{border-color:#111111 !important}
.msg-ok{background:#EEF4EA;color:#2F4A26}
.msg-bad{background:#F9E9E2;color:#7A2E10}
.pill{transition:top .45s cubic-bezier(.3,1.3,.5,1),opacity .3s ease}
.tone .tdot{background:#FFFFFF;border:1px solid #CFCFCD;transition:background .3s ease,border-color .3s ease,transform .3s ease}
.tone:hover .tdot{border-color:#111111}
.tone-on .tdot{background:#111111;border-color:#111111;transform:scale(1.25)}
.tone-on{font-weight:500}
.tg-on{background:#111111;color:#FFFFFF}.tg-off{background:transparent;color:#111111}
.dot-on{width:26px;background:#E6DAF0}.dot-off{width:10px;background:#FFFFFF}
.stA{animation:popin .5s cubic-bezier(.2,1.5,.4,1) both}.stB{animation:popin2 .5s cubic-bezier(.2,1.5,.4,1) both}
.steplbl{align-self:flex-start;display:inline-flex;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#111111;border:1.5px solid #111111;border-radius:999px;padding:5px 12px;margin-bottom:-6px}
.sp-on{background:#111111;color:#FFFFFF}.sp-done{background:#DCEBD2;color:#111111}.sp-off{background:#FFFFFF;color:#8A8A8A;border-color:#CFCFCD !important}
.bar-on{background:#111111}.bar-seen{background:#DCEBD2}.bar-off{background:#E3E3E1}
.seg-on{background:#111111}.seg-off{background:#D6D6D4}
.locked{filter:blur(10px) brightness(1.04);pointer-events:none;user-select:none}
.open{filter:none;transition:filter 1.2s ease}
input,textarea{color:#111111}
input::placeholder,textarea::placeholder{color:#8A8A8A}
input:focus,textarea:focus{outline:1px solid #111111;outline-offset:2px}
@media (max-width:720px){
  .hero-title{font-size:50px !important}
  .h2{font-size:38px !important}
  .hide-m{display:none !important}
  .hero-box{min-height:620px !important}
}

@media (max-width:720px){
  .wrap{padding-left:26px !important;padding-right:26px !important}
  .m-ram .wrap{padding-top:64px !important;padding-bottom:64px !important;gap:56px !important}
  .m-ram h2{font-size:58px !important}
  .bob{font-size:12px !important;padding:7px 12px !important}
  .m-pic{width:min(250px,100%) !important}
  .m-pic .bob:nth-of-type(1){right:-4% !important}
  .m-pic .b2{left:-4% !important}
  .m-story{padding:24px 20px !important;gap:22px !important}
  .m-story .sq{font-size:22px !important;min-height:0 !important;text-align:center}
  .st-right{align-items:center !important;text-align:center}
  .st-tg{align-self:center !important}
  .st-nav{justify-content:center !important}
  .m-sec{padding-bottom:72px !important}
  .m-band{margin:28px 0 0 !important}
  .m-band span[style*="56px"]{font-size:36px !important}
  .m-hero{padding:30px 20px !important;gap:28px !important}
  .m-test{padding:40px 18px !important}
  .m-contact{padding:30px 20px !important;gap:30px !important}
  .m-lesson{padding:26px 6px 14px !important;gap:26px !important}
  .m-dcard{min-height:0 !important;padding:22px !important}
  .m-dcard .dq{font-size:24px !important}
  .m-dcard .dfoot{margin-top:10px !important}
  .m-photo{width:100% !important;height:220px !important}
  .m-gap{gap:28px !important}
  .m-ltitle{font-size:28px !important}
  .m-badge{padding:22px 20px !important}
  .tab{flex-direction:column !important;align-items:center !important;text-align:center !important;padding:12px 6px !important;gap:8px !important}
  .tab .tlabel{display:none !important}
  .tab .ttitle{white-space:normal !important;font-size:13px !important;line-height:1.25 !important}
  .tab .tbox{align-items:center !important}
}

.acc{color:#111111 !important;background:linear-gradient(transparent 58%, var(--mk,#F5E6B8) 58%, var(--mk,#F5E6B8) 92%, transparent 92%);padding:0 .06em}
.mk1{--mk:#F5E6B8}.mk2{--mk:#D3E4F3}.mk3{--mk:#DCEBD2}.mk4{--mk:#E6DAF0}.mk5{--mk:#F6D9C4}.mk6{--mk:#F2D4D4}.mkw{--mk:#FFFFFF}
.ccard{background:#F2D4D4 !important}
.cm{font-family:'Instrument Serif',serif;font-weight:400;font-style:normal;font-size:1.05em;letter-spacing:.02em;display:inline-block;margin-right:.04em;line-height:0}
.blue{background:#D3E4F3 !important;color:#111111;border-color:#111111 !important}
.m-contact.blue{background:#F5E6B8 !important;border:1.5px solid #111111 !important}
.blue p,.blue label{color:#333333 !important}
.blue .card{color:#111111 !important;border:1.5px solid #111111 !important}
.blue input,.blue textarea{color:#111111;border:1.5px solid #111111 !important;background:#FFFFFF !important}
.m-bluesec{border-bottom:1.5px solid #111111}
.dark{background:#111111 !important;color:#FFFFFF;border-color:#111111 !important}
.dark span{color:#E8E8E6 !important}
.dark .slabel{color:#FFFFFF !important}
.dark .btn-line{color:#FFFFFF !important;border-color:#6B6B6B !important;background:transparent !important}
.dark .seg-on{background:#FFFFFF}.dark .seg-off{background:#333333}
@media (max-width:720px){.m-bluesec{padding:64px 0 !important;margin-bottom:72px !important}}
@media (max-width:720px){
  .wrap p{font-size:16px !important;line-height:1.7 !important}
  .h2{line-height:1.06 !important}
  .ram-col{gap:34px !important}
  .m-ram h2{font-size:54px !important}
  .chatbox{padding:22px 18px !important;gap:20px !important;border-radius:22px !important}
  .chatbox .chip{font-size:13px !important;padding:8px 14px !important}
  .chip{font-size:14px}
  .sechead{margin-bottom:44px !important;gap:20px !important}
  .m-lesson > div{gap:24px !important}
  .m-dcard{gap:12px}
  .m-sec{padding-bottom:96px !important}
  .m-ram .wrap{padding-top:80px !important;padding-bottom:80px !important;gap:64px !important}
  .m-bluesec{padding:80px 0 !important;margin-bottom:96px !important}
}
</style>

<script src="vue.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">


<div style="font-family:'Inter',system-ui,sans-serif;color:#111111;background:#FFFFFF;min-height:100vh">

  
  <div class="wrap" style="max-width:1200px;margin:0 auto;padding:22px 32px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
    <a href="#inicio" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#111111">
      <span class="pulse" style="width:9px;height:9px;border-radius:50%;background:#111111;display:inline-block"></span>
      <span style="font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:300;letter-spacing:.02em">descúbrete</span>
    </a>
    <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">
      <a href="#pruebalo" class="hide-m" style="padding:10px 14px;text-decoration:none;color:#6B6B6B;font-size:14px">Pruébalo</a>
      <a href="#dudas" class="hide-m" style="padding:10px 14px;text-decoration:none;color:#6B6B6B;font-size:14px">Lo que has oído</a>
      <a href="#videos" class="hide-m" style="padding:10px 14px;text-decoration:none;color:#6B6B6B;font-size:14px">Vídeos</a>
      <a href="#test" class="hide-m" style="padding:10px 14px;text-decoration:none;color:#6B6B6B;font-size:14px">Test</a>
      <a href="#contacto" class="btn btn-line" style="padding:10px 18px;border:1px solid #CFCFCD;border-radius:999px;text-decoration:none;color:#111111;font-size:14px">Habla conmigo</a>
    </div>
  </div>

  
  <div id="inicio" class="wrap" style="max-width:1200px;margin:0 auto;padding:16px 32px 32px">
    <div class="m-hero m-gap" style="border:1px solid #E3E3E1;border-radius:32px;background:#FFFFFF;padding:64px 56px;display:flex;flex-wrap:wrap;gap:56px;align-items:center">
      <div class="fade" style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:26px">
        <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid #E3E3E1;border-radius:999px;background:#FFFFFF;font-size:13px;color:#4A4A4A">
          <span class="pulse" style="width:7px;height:7px;border-radius:50%;background:#111111;display:inline-block"></span>Para cualquier persona, de cualquier edad
        </span>
        <h1 class="hero-title" style="margin:0;font-family:'Inter Tight',sans-serif;font-weight:200;font-size:84px;line-height:1;letter-spacing:-.045em">Scientology es para ti. <span class="acc mk1" style="font-weight:400;color:#111111">Y para cualquiera.</span></h1>
        <p style="margin:0;max-width:540px;font-size:19px;line-height:1.65;color:#4A4A4A">Para entenderte mejor, llevarte mejor con los tuyos y vivir con más ganas. Te lo cuento yo, Ramiro, como me lo contaron a mí: con calma y sin rollos.</p>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <a href="#dudas" class="btn btn-main" style="padding:15px 28px;border-radius:999px;background:#111111;color:#FFFFFF;text-decoration:none;font-weight:500;font-size:15px">Cuéntame más</a>
          <a href="#test" class="btn btn-line" style="padding:15px 28px;border-radius:999px;border:1px solid #CFCFCD;color:#111111;text-decoration:none;font-weight:500;font-size:15px">Test de 1 minuto</a>
        </div>
      </div>
      <div class="fade d2" style="flex:1 1 380px;min-width:0;border:1.5px solid #111111;border-radius:26px;background:#F5E6B8;padding:30px;display:flex;flex-direction:column;gap:20px">
        <span style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:28px;line-height:1.15;letter-spacing:-.025em">¿Qué te gustaría mejorar?</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <template v-for="g in goals">
            <button type="button" @click="g.pick" :class="`btn chip ${g.cls}`" style="font:inherit;font-size:14px;cursor:pointer;padding:11px 18px;border-radius:999px;border:1px solid #D6D6D4">{{g.label}}</button>
          </template>
        </div>
        <div class="swap" style="border:1px solid #E3E3E1;border-radius:20px;background:#FFFFFF;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:150px">
          <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#111111">{{goalTitle}}</span>
          <span style="font-size:16px;line-height:1.6;color:#333333">{{goalText}}</span>
          <a href="#curso" style="margin-top:auto;font-size:14px;font-weight:500;text-decoration:none">Ver cómo empezar →</a>
        </div>
      </div>
    </div>
    <div style="margin-top:28px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center">
      <div style="display:flex">
        <template v-for="f in faces">
          <span :style="`width:52px;height:52px;border-radius:50%;border:2px solid #FFFFFF;background:${f.bg};margin-left:-10px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#8A8A8A`">foto</span>
        </template>
      </div>
      <span style="font-size:15px;color:#4A4A4A">Estudiantes, padres, abuelos, emprendedores… <span style="color:#111111;font-weight:500">gente como tú.</span></span>
    </div>
  </div>

  
  <div aria-hidden="true" class="m-band" style="overflow:hidden;padding:26px 0;margin:48px 0 0;background:#111111">
    <div class="track" style="align-items:center">
      <template v-for="b in band">
        <span style="font-family:'Inter Tight',sans-serif;font-weight:300;font-size:56px;letter-spacing:-.035em;color:#FFFFFF;padding:0 30px;white-space:nowrap">{{b}}</span>
        <span style="width:12px;height:12px;border-radius:50%;border:1.5px solid #FFFFFF;display:inline-block;flex:0 0 auto"></span>
      </template>
    </div>
  </div>

  
  <div style="border-top:1.5px solid #111111;border-bottom:1.5px solid #111111;background:#FFFFFF;margin-bottom:0" class="m-ram">
    <div class="wrap" style="max-width:1200px;margin:0 auto;padding:110px 32px;display:flex;flex-wrap:wrap;gap:72px;align-items:center">
      <div class="reveal" style="flex:1 1 300px;display:flex;justify-content:center;min-width:0">
        <div class="m-pic" style="position:relative;width:min(380px,100%);aspect-ratio:1 / 1">
          <svg viewBox="0 0 300 300" aria-hidden="true" style="position:absolute;inset:-6%;width:112%;height:112%;overflow:visible"><circle cx="150" cy="150" r="146" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="2 7" stroke-linecap="round" class="spinr"></circle></svg>
          <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid #111111;background:#F6D9C4"></div>
          <div style="position:absolute;inset:7%;border-radius:50%;border:1.5px solid #111111;background:#FFFFFF;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:500;color:#6B6B6B">[Tu foto]</div>
          <span class="bob" style="position:absolute;right:-6%;top:8%;border:1.5px solid #111111;background:#FFFFFF;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;white-space:nowrap">Empresario</span>
          <span class="bob b2" style="position:absolute;left:-8%;bottom:20%;border:1.5px solid #111111;background:#111111;color:#FFFFFF;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;white-space:nowrap">Scientologist</span>
          <span class="bob b3" style="position:absolute;right:2%;bottom:2%;border:1.5px solid #111111;background:#F6D9C4;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;white-space:nowrap">Barcelona</span>
        </div>
      </div>
      <div class="reveal ram-col" style="flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:30px">
        <span class="slabel" style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#111111">01 — Quién te lo cuenta</span>
        <h2 class="h2" style="margin:0;font-family:'Inter Tight',sans-serif;font-weight:200;font-size:96px;line-height:1.02;letter-spacing:-.05em">Hola<span class="cm">,</span><br>soy <span class="acc mk5" style="font-weight:400;color:#111111">Ramiro.</span></h2>
        <p style="margin:0;font-size:19px;line-height:1.6;color:#333333;max-width:560px">Esta no es una web oficial: es la mía. La he hecho porque mucha gente me pregunta y casi nadie tiene la información de primera mano. <span style="font-weight:500;color:#111111">Pregúntame lo que quieras.</span></p>
        <div class="chatbox" style="border:1.5px solid #111111;border-radius:26px;background:#F6D9C4;padding:24px;display:flex;flex-direction:column;gap:18px;max-width:600px">
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <template v-for="q in asks">
              <button type="button" @click="q.pick" :class="`btn chip ${q.cls}`" style="font:inherit;font-size:14px;cursor:pointer;padding:10px 16px;border-radius:999px;border:1.5px solid #111111">{{q.t}}</button>
            </template>
          </div>
          <template v-if="chatOn">
            <div style="display:flex;flex-direction:column;gap:10px">
              <span :class="popCls" style="align-self:flex-end;max-width:85%;background:#111111;color:#FFFFFF;border-radius:18px 18px 4px 18px;padding:12px 16px;font-size:15px;line-height:1.45">{{chatQ}}</span>
              <span :class="`${popCls} d-late`" style="align-self:flex-start;max-width:90%;background:#FFFFFF;border:1.5px solid #111111;border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:15px;line-height:1.5;color:#111111">{{chatA}}</span>
            </div>
          </template>
          <template v-if="chatOff">
            <span style="display:inline-flex;align-items:center;gap:10px;font-size:14px;color:#6B6B6B"><span class="pulse" style="width:8px;height:8px;border-radius:50%;background:#111111;display:inline-block"></span>Toca una pregunta</span>
          </template>
        </div>
      </div>
    </div>
  </div>

  
  <div class="blue m-bluesec" style="padding:110px 0;margin-bottom:120px">
  <div id="dudas" class="wrap" style="max-width:1200px;margin:0 auto;padding:0 32px">
    <div class="reveal sechead" style="display:flex;flex-direction:column;gap:22px;max-width:760px;margin-bottom:56px">
      <span class="slabel" style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#111111">02 — Lo que seguramente has oído</span>
      <h2 class="h2" style="margin:0;font-family:'Inter Tight',sans-serif;font-weight:200;font-size:68px;line-height:1.02;letter-spacing:-.04em">Pregúntame lo que quieras. <span class="acc mkw" style="font-weight:400;color:#111111">De verdad.</span></h2>
      <p style="margin:0;font-size:16px;color:#6B6B6B">Toca una tarjeta para ver la respuesta.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px">
      <template v-for="d in dudas">
        <button type="button" @click="d.toggle" class="card m-dcard" style="text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:270px;padding:30px;border-radius:24px;border:1px solid #E3E3E1;background:#FFFFFF;display:flex;flex-direction:column">
          <template v-if="d.closed">
            <span class="swap" style="display:flex;flex-direction:column;gap:16px;flex:1">
              <span style="font-size:13px;color:#111111;letter-spacing:.08em">{{d.num}}</span>

<script>
class DCLogic { constructor(props) { this.props = props || {}; } setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); } forceUpdate() {} }

  constructor(props) {
    super(props);
    this.state = { step: 0, story: 0, after: false, stTick: 0, ask: -1, goal: 0, tab: 0, seen: { 0: true }, dRound: 0, dPick: -1, dFirst: true, dScore: 0, arcStage: 'learn', focus: 2, va: 2, vr: 2, vc: 2, hit: '', arcRound: 0, arcPick: -1, arcMsg: '', arcOk: true, shake: 0, tone: 3, open: {}, videosOpen: true, qi: 0, answers: [], sent: false };

  componentWillUnmount() { this._tok = (this._tok || 0) + 1; clearTimeout(this._t); }
  tweenTo(t, ms, done) {

    const from = { va: this.state.va, vr: this.state.vr, vc: this.state.vc };
    const t0 = performance.now();
    const ease = (x) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const step = (now) => {
      if (tok !== this._tok) return;
      const k = Math.min(1, (now - t0) / ms), e = ease(k), p = {};
      Object.keys(t).forEach((key) => { p[key] = from[key] + (t[key] - from[key]) * e; });
      this.setState(p);
      if (k < 1) requestAnimationFrame(step); else if (done) done();
    };
    requestAnimationFrame(step);
  }
  hitCorner(key, lvl) {
    clearTimeout(this._t);
    this.tweenTo({ [key]: lvl }, 450, () => {
      this._t = setTimeout(() => this.tweenTo({ va: lvl, vr: lvl, vc: lvl }, 700), 250);
    });
  }

      { name: '[Nombre], [edad]', tag: 'Estudiante', bg: '#E6DAF0', a: '[Antes: cómo estaba, en una frase. Ej.: dudas, estudios, motivación.]', d: '[Después: qué cambió, en una frase concreta.]' }
    ];
    const st = STORIES[s.story];

      { q: 'Tu hermano te vuelve a pedir dinero. Es la cuarta vez este año.', o: [
        { t: 'Le dejas una parte y le ayudas a buscar trabajo.', h: [1, 2, 3], x: [], m: 'Le ayudas de verdad, cuidas tu economía y él vuelve a sumar en su entorno.' },
        { t: 'Se lo das, como siempre.', h: [2], x: [1, 3], m: 'Ayudas a tu hermano hoy, pero perjudicas tu economía y el problema sigue igual.' },
        { t: 'Le dices que no y dejas de hablarle.', h: [1], x: [2], m: 'Proteges tu dinero, pero rompes con tu familia.' }] }
    ];
    const dPlaying = s.dRound < DROUNDS.length;
    const dR = dPlaying ? DROUNDS[s.dRound] : null;
    const dBestN = dR ? Math.max.apply(null, dR.o.map((o) => o.h.length - o.x.length)) : 0;
    const dSel = dR && s.dPick >= 0 ? dR.o[s.dPick] : null;
    const dIsBest = dSel ? (dSel.h.length - dSel.x.length) === dBestN : false;
    const bands = {};
    const legend = DN.map((n, i) => {
      const k = i + 1;
      const c = !dSel ? 'b-neutral' : (dSel.h.indexOf(k) >= 0 ? 'b-help' : (dSel.x.indexOf(k) >= 0 ? 'b-harm' : 'b-neutral'));
      bands['b' + k] = c;
      return { n: k, name: n, cls: c };
    });
    const dOpts = dR ? dR.o.map((o, i) => ({ t: o.t,
      cls: i === s.dPick ? (dIsBest ? 'chip-best' : 'chip-on') : 'chip-off',
      pick: () => {
        const best = (o.h.length - o.x.length) === dBestN;
        this.setState({ dPick: i, dScore: s.dScore + (s.dFirst && best ? 1 : 0), dFirst: false });
      } })) : [];
    const AR = [
      { q: 'Llevas tres días sin hablar con tu pareja después de una discusión.', o: [
        { t: 'Esperas a que dé el primer paso.', k: 'vc', g: false, m: 'Sin comunicación, el triángulo entero se viene abajo. Cuanto más esperas, más difícil es.' },
        { t: 'Le escribes: «¿Hablamos esta noche? Te echo de menos».', k: 'vc', g: true, m: 'Has subido la comunicación… y mira: la afinidad y la realidad la siguen solas.' },
        { t: 'Le sueltas de golpe todo lo que te molestó.', k: 'va', g: false, m: 'Has bajado la afinidad. Prueba a hablarle a alguien enfadado: la comunicación tampoco entra.' }] },
      { q: 'Tu compañero nuevo de trabajo te cae fatal y apenas os habláis.', o: [
        { t: 'Le corriges delante de todos para que quede claro quién tiene razón.', k: 'vr', g: false, m: 'Has bajado la realidad: el desacuerdo en público rompe el acuerdo, y con él todo lo demás.' },
        { t: 'Le ignoras. Ya se le pasará.', k: 'vc', g: false, m: 'Sin comunicación no hay forma de que la relación mejore.' },
        { t: 'Descubres que os encanta el mismo equipo y le sacas el tema.', k: 'vr', g: true, m: 'Has subido la realidad: encontrar algo en lo que estáis de acuerdo. Ya os comunicáis mejor y os caéis mejor.' }] },
      { q: 'Tu hijo adolescente está de morros y no te cuenta nada.', o: [
        { t: 'Le preparas su cena favorita y le dices que te importa, sin presionarle.', k: 'va', g: true, m: 'Has subido la afinidad. Ahora le resulta más fácil abrirse y contarte qué le pasa.' },
        { t: 'Le castigas sin móvil hasta que hable.', k: 'va', g: false, m: 'Has bajado la afinidad, y con ella se cierra todavía más.' },
        { t: 'Le preguntas «¿qué te pasa?» diez veces seguidas.', k: 'vc', g: false, m: 'Forzar no es comunicar. La comunicación tiene que ser real y recibida.' }] }
    ];
    const arcPlaying = s.arcRound < AR.length;
    const aR = arcPlaying ? AR[s.arcRound] : null;
    const aSel = aR && s.arcPick >= 0 ? aR.o[s.arcPick] : null;
    const arcOpts = aR ? aR.o.map((o, i) => ({ t: o.t, cls: i === s.arcPick ? (o.g ? 'chip-best' : 'chip-on') : 'chip-off',
      pick: () => {
        this.setState({ arcPick: i, arcOk: o.g, hit: o.k, shake: o.g ? s.shake : s.shake + 1 });
        this.setState({ va: 2, vr: 2, vc: 2 });
        this.hitCorner(o.k, o.g ? 4.6 : 0.7);
      } })) : [];
    const NAMES = { va: 'Afinidad', vr: 'Realidad', vc: 'Comunicación' };
    const CARDS = [
      { l: 'A', t: 'Afinidad', d: 'El grado de cariño o aprecio que sientes por alguien o por algo. Es la parte emocional.', k: 'va' },
      { l: 'R', t: 'Realidad', d: 'Lo que parece ser. En el fondo es acuerdo: lo que estáis de acuerdo en que es real.', k: 'vr' },
      { l: 'C', t: 'Comunicación', d: 'El intercambio de ideas entre dos personas. En las relaciones es la más importante de las tres.', k: 'vc' }
    ];
    const arcCards = CARDS.map((c, i) => ({ l: c.l, t: c.t, d: c.d, cls: i === s.focus ? 'k-on' : 'k-off',
      pick: () => { this.setState({ focus: i, hit: c.k }); this.setState({ va: 2, vr: 2, vc: 2 }); this.hitCorner(c.k, 4); } }));
    const R0 = 25, RS = 22;
    const vx = (lv, dx, dy) => ({ x: +(160 + dx * (R0 + RS * lv)).toFixed(1), y: +(165 + dy * (R0 + RS * lv)).toFixed(1) });
    const A = vx(s.va, 0, -1), Rr = vx(s.vr, -0.866, 0.5), C = vx(s.vc, 0.866, 0.5);
    const avg = (s.va + s.vr + s.vc) / 3;
    const lvTxt = (v) => String(Math.max(0, Math.min(5, Math.round(v))));
    const TONES = [
      ['Entusiasmo', '4.0', 'Tienes energía y ganas. Lo que tocas, avanza.', 'Aprovecha y anima a alguien que esté más bajo: el tono se contagia.'],
      ['Alegría', '3.5', 'Disfrutas de lo que haces y de la gente que te rodea.', 'Ponte hoy una meta un poco más grande de lo habitual.'],
      ['Conservadurismo', '3.0', 'Estás bien y tranquilo, pero sin arriesgar.', 'Haz hoy una cosa nueva, aunque sea pequeña.'],
      ['Aburrimiento', '2.5', 'Nada te llama mucho la atención.', 'Busca algo que te interese de verdad y dedícale 20 minutos.'],
      ['Antagonismo', '2.0', 'Te molesta lo que hacen o dicen los demás.', 'Antes de contestar, pregunta y escucha. La tensión baja.'],
      ['Enfado', '1.5', 'Algo te ha sentado mal y lo notas en el cuerpo.', 'Muévete: sal a caminar o haz ejercicio antes de hablarlo.'],
      ['Miedo', '1.0', 'Algo te preocupa y te frena.', 'Mira de frente lo que te preocupa y da un primer paso pequeño.'],
      ['Pesar', '0.5', 'Estás triste por algo que has perdido.', 'Habla con alguien de confianza. Comunicar ayuda a subir. Si te pasa a menudo, pide ayuda.'],
      ['Apatía', '0.05', 'Te da todo igual y no tienes fuerzas.', 'Empieza por algo muy simple, como ordenar una cosa a tu alrededor. Si te sientes así a menudo, habla con alguien cercano o con un profesional.']
    ];
    const ti = s.tone;
    const tones = TONES.map((t, i) => ({ name: t[0], v: t[1], cls: i === ti ? 'tone-on' : '', pick: () => this.setState({ tone: i }) }));
    const nextUp = ti > 0 ? TONES[ti - 1][0].toLowerCase() : null;
    const DUDAS = [
      { q: '¿Es una secta?', a: 'Es lo primero que nos preguntan y lo entendemos: se ha publicado mucho, también críticas. En España está inscrita como confesión religiosa desde 2007, tras una sentencia de la Audiencia Nacional. Nuestra experiencia: vamos porque nos aporta. Ven, pregunta lo que quieras y júzgalo tú.' },
      { q: '¿Qué creéis exactamente?', a: 'Que eres un ser espiritual, no solo un cuerpo y una mente. Que las personas son básicamente buenas y pueden mejorar su vida, sus relaciones y su capacidad aplicando unas herramientas concretas.' },
      { q: '¿Tengo que dejar mi religión?', a: 'No. Hay gente que sigue con su religión y aplica lo que aprende aquí. Nadie te va a pedir que dejes nada.' },
      { q: '¿Cuánto cuesta?', a: 'Hay cursos de introducción con un precio bajo y servicios más avanzados que se pagan como donación. Te decimos los precios claros desde el principio, sin sorpresas: [PRECIOS].' },
      { q: '¿Y lo que he leído en internet?', a: 'Hay de todo: críticas, polémicas y también datos que no son correctos. No te pedimos que no lo leas. Te pedimos que también escuches a quien lo vive desde dentro y saques tus propias conclusiones.' },
      { q: '¿Qué metas tiene?', a: 'Ayudar a construir un mundo con menos guerras, menos delincuencia y menos locura, donde las personas capaces puedan prosperar y la gente honesta tenga sus derechos. Y empieza por mejorar a cada persona.' }
    ];
    const dudas = DUDAS.map((d, i) => {
      const isOpen = !!s.open[i];
      return {
        q: d.q, a: d.a, num: '0' + (i + 1),
        open: isOpen, closed: !isOpen,
        toggle: () => this.setState({ open: Object.assign({}, s.open, { [i]: !isOpen }) })
      };
    });

    const QS = [
      '¿Sientes que podrías sacar mucho más de tu vida?',
      '¿Te pasa que repites los mismos problemas con la gente?',
      '¿Te gustaría entender por qué reaccionas como reaccionas?',
      '¿Te has preguntado quién eres de verdad, más allá del cuerpo?',
      '¿Te gustaría sentirte más tranquilo y seguro de ti mismo?'
    ];
    const done = s.qi >= QS.length;
    const pick = (v) => () => {
      const answers = s.answers.concat([v]);
      const next = s.qi + 1;
      const patch = { answers: answers, qi: next };
      if (next >= QS.length) patch.videosOpen = true;
      this.setState(patch);
    };
    const score = s.answers.reduce((a, b) => a + b, 0);
    const high = score >= 6;
    const words = ['Para estudiantes', 'Para padres', 'Para abuelos', 'Para emprendedores', 'Para deportistas', 'Para curiosos', 'Para parejas', 'Para ti'];

    return {
      tabs: tabs,
      step0: s.step === 0, step1: s.step === 1, step2: s.step === 2,
      stepsUI: ['1 · La idea', '2 · El juego', '3 · Aplícalo'].map((t, i) => ({ t: t, cls: i === s.step ? 'sp-on' : (i < s.step ? 'sp-done' : 'sp-off') })),
      toStep1: () => { this.setState({ step: 1 }); if (s.tab === 1) { this.setState({ arcRound: 0, arcPick: -1, hit: '' }); this.tweenTo({ va: 2, vr: 2, vc: 2 }, 400); } },
      toStep2: () => this.setState({ step: 2 }),
      showPrev: s.step === 2 && s.tab > 0, showNext: s.step === 2 && s.tab < 2,
      lessonNum: s.tab + 1,
      lessonSeen: [0, 1, 2].filter((i) => s.seen[i]).length,
      hasPrev: s.tab > 0, hasNext: s.tab < 2,
      nextTitle: s.tab < 2 ? TABS[s.tab + 1] : '',
      goPrev: () => openTab(Math.max(0, s.tab - 1)),
      goNext: () => openTab(Math.min(2, s.tab + 1)),
      tab0: s.tab === 0, tab1: s.tab === 1, tab2: s.tab === 2,
      allSeen: allSeen,
      bands: bands,
      legend: legend,
      dHelp: dSel ? dSel.h.length : 0,
      dHarm: dSel ? dSel.x.length : 0,
      dPlaying: dPlaying,
      dNum: Math.min(s.dRound + 1, 3),
      dQ: dR ? dR.q : '',
      dOpts: dOpts,
      dPicked: !!dSel,
      dMsg: dSel ? (dIsBest ? 'La mejor opción. ' : 'Se puede hacer mejor. ') + dSel.m : '',
      dMsgCls: dIsBest ? 'msg-ok' : 'msg-bad',
      dNextLabel: dIsBest ? (s.dRound < 2 ? 'Siguiente situación' : 'Ver resultado') : 'Prueba otra opción, o sigue',
      dNext: () => this.setState({ dRound: s.dRound + 1, dPick: -1, dFirst: true }),
      dEnd: !dPlaying,
      dEndTitle: s.dScore === 3 ? 'Tres de tres a la primera. Lo has pillado.' : 'Has acertado ' + s.dScore + ' de 3 a la primera.',
      dReset: () => this.setState({ dRound: 0, dPick: -1, dFirst: true, dScore: 0 }),
      triPts: A.x + ',' + A.y + ' ' + Rr.x + ',' + Rr.y + ' ' + C.x + ',' + C.y,
      pA: { x: A.x, y: A.y, r: s.hit === 'va' ? 7 : 5, cls: s.hit === 'va' ? 'v-hit' : '' },
      pR: { x: Rr.x, y: Rr.y, r: s.hit === 'vr' ? 7 : 5, cls: s.hit === 'vr' ? 'v-hit' : '' },
      pC: { x: C.x, y: C.y, r: s.hit === 'vc' ? 7 : 5, cls: s.hit === 'vc' ? 'v-hit' : '' },
      compOp: Math.max(0.15, Math.min(1, avg / 4.6)).toFixed(2),
      lvA: lvTxt(s.va), lvR: lvTxt(s.vr), lvC: lvTxt(s.vc),
      shakeCls: s.shake === 0 ? '' : (s.shake % 2 ? 'shakeA' : 'shakeB'),
      arcLearn: s.arcStage === 'learn',
      arcGame: s.arcStage === 'game',
      arcCards: arcCards,
      arcStart: () => { this.setState({ arcStage: 'game', arcRound: 0, arcPick: -1, hit: '' }); this.tweenTo({ va: 2, vr: 2, vc: 2 }, 400); },
      arcBack: () => this.setState({ arcStage: 'learn' }),
      arcPlaying: arcPlaying,
      arcNum: Math.min(s.arcRound + 1, 3),
      arcQ: aR ? aR.q : '',
      arcOpts: arcOpts,
      arcHasMsg: !!aSel,
      arcMsgHead: aSel ? (aSel.g ? 'Sube la ' + NAMES[aSel.k] + ' · y las otras dos la siguen' : 'Baja la ' + NAMES[aSel.k] + ' · ruptura de ARC') : '',
      arcMsg: aSel ? aSel.m : '',
      arcMsgCls: s.arcOk ? 'msg-ok' : 'msg-bad',
      arcNextLabel: aSel && aSel.g ? (s.arcRound < 2 ? 'Siguiente situación' : 'Ver resultado') : 'Prueba otra opción, o sigue',
      arcNext: () => { this.setState({ arcRound: s.arcRound + 1, arcPick: -1, hit: '' }); this.tweenTo({ va: 2, vr: 2, vc: 2 }, 500); },
      arcEnd: !arcPlaying,
      arcEndTitle: 'Ya sabes cómo funciona: una esquina tira de las otras dos.',
      arcReset: () => { this.setState({ arcRound: 0, arcPick: -1, hit: '' }); this.tweenTo({ va: 2, vr: 2, vc: 2 }, 400); },
      tones: tones,
      pillTop: ti * 44,
      pillOp: 1,
      toneTitle: 'Estás en ' + TONES[ti][0].toLowerCase() + ' · ' + TONES[ti][1],
      toneText: TONES[ti][2] + (nextUp ? ' El siguiente escalón es ' + nextUp + '.' : ' Estás arriba del todo.'),
      toneApply: TONES[ti][3],
      asks: asks,
      popCls: s.ask % 2 ? 'popA' : 'popB',
      chatOn: s.ask >= 0, chatOff: s.ask < 0,
      chatQ: s.ask >= 0 ? ASKS[s.ask][0] : '',
      chatA: s.ask >= 0 ? ASKS[s.ask][1] : '',
      st: st,
      stNum: s.story + 1,
      stText: s.after ? st.d : st.a,
      stAnim: s.stTick % 2 ? 'stA' : 'stB',
      stBCls: s.after ? 'tg-off' : 'tg-on',
      stACls: s.after ? 'tg-on' : 'tg-off',
      stBefore: () => { if (s.after) this.setState({ after: false, stTick: s.stTick + 1 }); },
      stAfter: () => { if (!s.after) this.setState({ after: true, stTick: s.stTick + 1 }); },
      stPrev: go(-1), stNext: go(1),
      stDots: STORIES.map((x, i) => ({ cls: i === s.story ? 'dot-on' : 'dot-off' })),
      goals: goals,
      goalTitle: GOALS[gi].label,
      goalText: GOALS[gi].text,
      faces: ['#F6D9C4', '#D7E6F2', '#E3EED7', '#EADCF0', '#F3E7C2', '#F1D3D3'].map((c) => ({ bg: c })),
      band: words.concat(words),
      dudas: dudas,
      videos: [
        { t: '¿Qué es Scientology?', s: '[Vídeo oficial · 3 min]' },
        { t: '¿Quién fue L. Ron Hubbard?', s: '[Vídeo oficial · 4 min]' },
        { t: 'Scientology en acción', s: '[Vídeo · voluntariado y ayuda]' }
      ],
      exitosOld: [
        { txt: '[Historia real de una persona: qué problema tenía y qué cambió]', who: '[Nombre, edad · con su permiso]' },
        { txt: '[Historia real de una persona: qué problema tenía y qué cambió]', who: '[Nombre, edad · con su permiso]' },
        { txt: '[Historia real de una persona: qué problema tenía y qué cambió]', who: '[Nombre, edad · con su permiso]' }
      ],
      videosLocked: !s.videosOpen,
      videosClass: s.videosOpen ? 'open' : 'locked',
      unlockVideos: () => this.setState({ videosOpen: true }),
      steps: QS.map((q, i) => ({ cls: i < s.qi ? 'seg-on' : 'seg-off' })),
      quizRunning: !done,
      quizDone: done,
      qNum: Math.min(s.qi + 1, QS.length),
      qText: done ? '' : QS[s.qi],
      opts: [
        { label: 'Sí', pick: pick(2) },
        { label: 'A veces', pick: pick(1) },
        { label: 'No', pick: pick(0) }
      ],
      resultTitle: high ? 'Tienes mucha curiosidad por ti mismo.' : 'Hay algo que te ronda la cabeza.',
      resultText: high
        ? 'Eso es justo lo que mueve a la gente a dar el siguiente paso. El OCA es un test de personalidad gratuito de 200 preguntas que te da una foto muy clara de cómo estás ahora mismo.'
        : 'Aunque no lo tengas del todo claro, merece la pena mirarlo. El OCA es un test de personalidad gratuito de 200 preguntas, sin compromiso.',
      resetQuiz: () => this.setState({ qi: 0, answers: [] }),
      cursos: [
        { n: '01', t: 'Cómo mejorar tus relaciones', s: '[Duración] · [Precio]' },
        { n: '02', t: 'Cómo superar los altibajos', s: '[Duración] · [Precio]' },
        { n: '03', t: 'Cómo resolver conflictos', s: '[Duración] · [Precio]' },
        { n: '04', t: 'Comunicación personal', s: '[Duración] · [Precio]' }
      ],
      notSent: !s.sent,
      sent: s.sent,
      send: () => this.setState({ sent: true })
    };
  }
}

const { createApp, reactive, computed } = Vue;
const inst = new Component({});
inst.state = reactive(inst.state || {});
const app = createApp({
  template: '#tpl',
  setup() {
    const vals = computed(() => inst.renderVals());
    const out = {};
    Object.keys(vals.value).forEach((k) => Object.defineProperty(out, k, { get: () => vals.value[k], enumerable: true }));
    return out;
  }
});
app.config.compilerOptions.whitespace = 'preserve';
app.mount('#app');
</script>
</body>
</html>
