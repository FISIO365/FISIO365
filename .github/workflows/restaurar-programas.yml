# Una sola vez (3/11/2026): devuelve a la base de datos los programas de ejercicios que se guardaron en Airtable
# después de pasar a Postgres (el guardado del programa aún iba a Airtable). Los saca de la copia de seguridad cifrada.
# «probar» solo cuenta lo que haría; «aplicar» lo hace. En el registro no sale ningún dato de pacientes, solo números.
name: Restaurar programas de ejercicios

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'probar o aplicar'
        default: 'probar'
      fecha:
        description: 'Copia de seguridad (AAAA-MM-DD)'
        default: '2026-11-03'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Bajar la copia y sacar los programas
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          FECHA: ${{ inputs.fecha }}
        run: |
          set -e
          A=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=fisio365-backup-$FECHA&per_page=10" --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | "\(.id) \(.created_at)"')
          ID=${A%% *}; CUANDO=${A##* }
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "::error::No hay copia de $FECHA"; exit 1; }
          echo "Copia: $CUANDO"; echo "CUANDO=$CUANDO" >> $GITHUB_ENV
          gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > a.zip
          unzip -q a.zip
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in fisio365-backup-*.tar.gz.enc -out c.tar.gz -pass env:BACKUP_PASSWORD
          tar -xzf c.tar.gz --wildcards '*__tblvgE0a4gsrj4Vhp.json'
          mv $(find . -name '*__tblvgE0a4gsrj4Vhp.json' | head -1) planes.json
          rm -rf a.zip c.tar.gz fisio365-backup-*
      - name: Enviar a la app
        env:
          MODO: ${{ inputs.modo }}
        run: |
          set -e
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=fisio365-restaurar" | jq -r .value)
          node -e '
            const fs=require("fs");const L=JSON.parse(fs.readFileSync("planes.json","utf8")).filter(r=>String(r.createdTime||"")>="2026-10-30");
            fs.writeFileSync("cuerpo.json",JSON.stringify({modo:process.env.MODO,copiaEn:new Date(process.env.CUANDO).toISOString(),records:L}));
            console.log("Programas guardados desde el 30/10 en la copia:",L.length);'
          curl -sS -X POST "https://app.fisioterapia365.com/api/schedule?action=pg-restaurar-programas" -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' --data-binary @cuerpo.json
          rm -f planes.json cuerpo.json
